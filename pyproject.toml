[project]
name = "learning-lpackage"
version = "0.1.0"
description = ""
authors = [
    {name = "Noah Cho"}
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "django (>=6.1.1,<7.0.0)",
    "django-bootstrap5 (>=26.3,<27.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.4.0,<3.0.0)"
]
[tool.mypy]
explicit_package_bases = true
namespace_packages = true